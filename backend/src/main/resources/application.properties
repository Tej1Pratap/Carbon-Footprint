# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carbon_footprint_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${PORT:8080}

# Optional local properties file (loaded if present, gitignored for local secrets)
spring.config.import=optional:classpath:application-local.properties,optional:file:./backend/src/main/resources/application-local.properties

# Admin Setup
admin.email=${ADMIN_EMAIL:defaultadmin@admin.com}
admin.password=${ADMIN_PASSWORD:defaultadmin123}

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Secret
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=2592000000

# Email Configuration (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google OAuth2 Client ID
google.client.id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

# AI Service Keys (Groq / Gemini)
groq.api.key=${GROQ_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

# Brevo API Key for HTTP Email Sending
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@ecotrack.com}
brevo.sender.name=${BREVO_SENDER_NAME:EcoTrack Security}
